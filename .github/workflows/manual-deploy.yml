name: Manual Production Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Points to the lock file inside your subfolder
          cache-dependency-path: library-frontend/package-lock.json

      # 1. Install Dependencies
      # We go into the folder because that is where package.json is
      - name: Install Dependencies
        working-directory: ./library-frontend
        run: npm ci

      # 2. Build Project
      # We go into the folder because that is where the build script is
      - name: Build Project
        working-directory: ./library-frontend
        run: npm run build

      # 3. Deploy to Vercel
      # 🛑 CRITICAL FIX: We do NOT use working-directory here.
      # We run this from the Root. Vercel's dashboard settings will automatically
      # find the 'library-frontend' folder.
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          vercel-version: 'latest' # Forces the new Vercel CLI
