name: Manual Production Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Points to the correct lock file location
          cache-dependency-path: library-frontend/package-lock.json

      # 1. Install Dependencies (Runs inside the subfolder)
      - name: Install Dependencies
        working-directory: ./library-frontend
        run: npm ci

      # 2. Build Project (Runs inside the subfolder)
      - name: Build Project
        working-directory: ./library-frontend
        run: npm run build

      # 3. Deploy to Vercel
      # We removed 'defaults', so './library-frontend' is now the correct path from Root
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          vercel-version: 'latest' # Forces the new Vercel CLI
          working-directory: ./library-frontend
